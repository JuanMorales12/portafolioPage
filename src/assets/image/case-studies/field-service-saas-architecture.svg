ion photos</text><rect x="1280" y="330" width="260" height="120" rx="12" fill="#111827" stroke="#2a3446"/><rect x="1280" y="344" width="4" height="92" rx="2" fill="#c084fc"/><text x="1300" y="360" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Migration</text><text x="1300" y="384" font-family="Inter" font-size="14" fill="#94a3b8">Existing company moved in</text><text x="1300" y="405" font-family="Inter" font-size="14" fill="#94a3b8">as tenant #1 (scripted SQL)</text><text x="1300" y="426" font-family="Inter" font-size="14" fill="#94a3b8">no rewrite from scratch</text><rect x="1280" y="560" width="260" height="100" rx="12" fill="#111827" stroke="#2a3446"/><rect x="1280" y="574" width="4" height="72" rx="2" fill="#c084fc"/><text x="1300" y="590" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Stripe</text><text x="1300" y="614" font-family="Inter" font-size="14" fill="#94a3b8">Checkout · subscriptions</text><text x="1300" y="635" font-family="Inter" font-size="14" fill="#94a3b8">signed webhooks</text><rect x="1280" y="690" width="260" height="100" rx="12" fill="#111827" stroke="#2a3446"/><rect x="1280" y="704" width="4" height="72" rx="2" fill="#c084fc"/><text x="1300" y="720" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Resend</text><text x="1300" y="744" font-family="Inter" font-size="14" fill="#94a3b8">new order · assigned</text><text x="1300" y="765" font-family="Inter" font-size="14" fill="#94a3b8">rescheduled · cancelled</text><path d="M320,255 L400,280" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mmuted)"/><path d="M320,365 L400,350" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mmuted)"/><path d="M320,475 L360,475 L360,390 L400,390" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mmuted)"/><path d="M320,585 L370,585 L370,475 L400,475" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mmuted)"/><path d="M730,265 L810,265" fill="none" 