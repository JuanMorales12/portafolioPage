<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="mamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="samber" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fbbf24"/></marker><marker id="mviolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/></marker><marker id="sviolet" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c084fc"/></marker><marker id="mrose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker><marker id="srose" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb7185"/></marker><marker id="memerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="semerald" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#34d399"/></marker><marker id="msky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ssky" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#38bdf8"/></marker></defs><rect width="1600" height="1000" fill="#0b0f17"/><text x="60" y="70" font-family="JetBrains Mono" font-size="14" letter-spacing="2" fill="#818cf8">CASE STUDY · CLAUDE OPS AGENT</text><text x="60" y="108" font-family="Inter" font-weight="700" font-size="34" fill="#e5e7eb">Claude ops agent with human approval</text><text x="60" y="140" font-family="Inter" font-size="17" fill="#94a3b8">AI customer service for an ERP-based business. The model can read, and can only request changes; a person approves.</text><rect x="400" y="180" width="500" height="700" rx="18" fill="#38bdf8" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.45" stroke-dasharray="6 6"/><text x="418" y="208" font-family="JetBrains Mono" font-size="13" letter-spacing="1.5" fill="#38bdf8">AGENT SERVICE · NODE.JS + TYPESCRIPT</text><rect x="950" y="180" width="590" height="700" rx="18" fill="#fb7185" fill-opacity="0.04" stroke="#fb7185" stroke-opacity="0.45" stroke-dasharray="6 6"/><text x="968" y="208" font-family="JetBrains Mono" font-size="13" letter-spacing="1.5" fill="#fb7185">TRUST BOUNDARY · CODE, NOT PROMPT</text><rect x="60" y="220" width="280" height="90" rx="12" fill="#111827" stroke="#2a3446"/><rect x="60" y="234" width="4" height="62" rx="2" fill="#818cf8"/><text x="80" y="250" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Customer</text><text x="80" y="274" font-family="Inter" font-size="14" fill="#94a3b8">Telegram chat</text><rect x="60" y="350" width="280" height="90" rx="12" fill="#111827" stroke="#2a3446"/><rect x="60" y="364" width="4" height="62" rx="2" fill="#818cf8"/><text x="80" y="380" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Operator</text><text x="80" y="404" font-family="Inter" font-size="14" fill="#94a3b8">Telegram · /aprobar SOL-XXXX</text><rect x="60" y="480" width="280" height="110" rx="12" fill="#111827" stroke="#2a3446"/><rect x="60" y="494" width="4" height="82" rx="2" fill="#818cf8"/><text x="80" y="510" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Internal team</text><text x="80" y="534" font-family="Inter" font-size="14" fill="#94a3b8">Claude Desktop / Claude Code</text><text x="80" y="555" font-family="Inter" font-size="14" fill="#94a3b8">via MCP</text><rect x="420" y="215" width="460" height="110" rx="12" fill="#111827" stroke="#2a3446"/><rect x="420" y="229" width="4" height="82" rx="2" fill="#38bdf8"/><text x="440" y="245" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Telegram gateway</text><text x="440" y="269" font-family="Inter" font-size="14" fill="#94a3b8">One chat at a time, messages in order</text><rect x="420" y="345" width="460" height="195" rx="12" fill="#111827" stroke="#2a3446"/><rect x="420" y="359" width="4" height="167" rx="2" fill="#38bdf8"/><text x="440" y="375" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Agent (Anthropic SDK tool runner)</text><text x="440" y="399" font-family="Inter" font-size="14" fill="#94a3b8">No agent framework</text><text x="440" y="420" font-family="Inter" font-size="14" fill="#94a3b8">Iteration + token caps</text><text x="440" y="441" font-family="Inter" font-size="14" fill="#94a3b8">Retries with backoff on 429 / 5xx</text><text x="440" y="462" font-family="Inter" font-size="14" fill="#94a3b8">Handles refusals and tool loops</text><text x="440" y="483" font-family="Inter" font-size="14" fill="#94a3b8">Prompt caching · tokens + USD per turn</text><rect x="420" y="560" width="300" height="100" rx="12" fill="#111827" stroke="#2a3446"/><rect x="420" y="574" width="4" height="72" rx="2" fill="#38bdf8"/><text x="440" y="590" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">MCP server</text><text x="440" y="614" font-family="Inter" font-size="14" fill="#94a3b8">same backend, same rules</text><rect x="420" y="690" width="460" height="160" rx="12" fill="#111827" stroke="#2a3446"/><rect x="420" y="704" width="4" height="132" rx="2" fill="#c084fc"/><text x="440" y="720" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Claude</text><text x="440" y="744" font-family="Inter" font-size="14" fill="#94a3b8">read-only tools</text><text x="440" y="765" font-family="Inter" font-size="14" fill="#94a3b8">+ one “request action” tool</text><rect x="970" y="215" width="550" height="140" rx="12" fill="#111827" stroke="#2a3446"/><rect x="970" y="229" width="4" height="112" rx="2" fill="#fb7185"/><text x="990" y="245" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Business rules (TypeScript + Zod)</text><text x="990" y="269" font-family="Inter" font-size="14" fill="#94a3b8">Customers only see their own orders</text><text x="990" y="290" font-family="Inter" font-size="14" fill="#94a3b8">Action allowed only in valid order states</text><text x="990" y="311" font-family="Inter" font-size="14" fill="#94a3b8">Required data validated</text><rect x="970" y="380" width="550" height="130" rx="12" fill="#111827" stroke="#2a3446"/><rect x="970" y="394" width="4" height="102" rx="2" fill="#fbbf24"/><text x="990" y="410" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Approval queue</text><text x="990" y="434" font-family="Inter" font-size="14" fill="#94a3b8">Idempotent requests SOL-XXXX</text><text x="990" y="455" font-family="Inter" font-size="14" fill="#94a3b8">Atomic writes</text><rect x="970" y="535" width="550" height="110" rx="12" fill="#111827" stroke="#2a3446"/><rect x="970" y="549" width="4" height="82" rx="2" fill="#34d399"/><text x="990" y="565" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">ERP adapter</text><text x="990" y="589" font-family="Inter" font-size="14" fill="#94a3b8">6-method interface: swap in a real ERP</text><rect x="970" y="670" width="550" height="100" rx="12" fill="#111827" stroke="#2a3446"/><rect x="970" y="684" width="4" height="72" rx="2" fill="#34d399"/><text x="990" y="700" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">ERP</text><text x="990" y="724" font-family="Inter" font-size="14" fill="#94a3b8">refund · cancel · change address</text><rect x="970" y="790" width="550" height="75" rx="12" fill="#111827" stroke="#2a3446"/><rect x="970" y="804" width="4" height="47" rx="2" fill="#818cf8"/><text x="990" y="820" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Customer notified</text><text x="990" y="844" font-family="Inter" font-size="14" fill="#94a3b8">after approval</text><path d="M340,265 L420,265" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#msky)"/><path d="M340,395 L380,395 L380,300 L420,300" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#msky)"/><path d="M340,535 L420,605" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#msky)"/><rect x="360.2" y="536" width="39.6" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="380" y="552.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">MCP</text><path d="M650,325 L650,345" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#msky)"/><path d="M800,540 L800,690" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#mviolet)" marker-start="url(#sviolet)"/><rect x="740.6" y="603" width="118.8" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="800" y="619.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">prompt ⇄ tools</text><path d="M880,400 L970,300" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#mrose)"/><rect x="901.6" y="333" width="46.8" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="925" y="349.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">read</text><path d="M880,470 L970,445" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#mamber)"/><rect x="890.8" y="468" width="68.4" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="925" y="484.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">request</text><path d="M340,415 L360,415 L360,925 L1565,925 L1565,445 L1520,445" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#mamber)"/><rect x="829.8" y="913" width="140.4" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="900" y="929.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">operator approves</text><path d="M1245,645 L1245,670" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#memerald)"/><path d="M1245,770 L1245,790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#memerald)"/><path d="M1245,510 L1245,535" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#mamber)"/><text x="1540" y="970" text-anchor="end" font-family="JetBrains Mono" font-size="12" fill="#475569">Architecture derived from the project source · names anonymized</text></svg>