<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="mamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="samber" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fbbf24"/></marker><marker id="mviolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/></marker><marker id="sviolet" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c084fc"/></marker><marker id="mmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="smuted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#94a3b8"/></marker><marker id="mrose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker><marker id="srose" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb7185"/></marker><marker id="msky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ssky" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#38bdf8"/></marker></defs><rect width="1600" height="1000" fill="#0b0f17"/><text x="60" y="70" font-family="JetBrains Mono" font-size="14" letter-spacing="2" fill="#818cf8">CASE STUDY · WHATSAPP AI AGENT</text><text x="60" y="108" font-family="Inter" font-weight="700" font-size="34" fill="#e5e7eb">WhatsApp AI booking agent</text><text x="60" y="140" font-family="Inter" font-size="17" fill="#94a3b8">A receptionist that books, reschedules and cancels real appointments, and can only offer slots that exist.</text><rect x="590" y="180" width="430" height="520" rx="18" fill="#38bdf8" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.45" stroke-dasharray="6 6"/><text x="608" y="208" font-family="JetBrains Mono" font-size="13" letter-spacing="1.5" fill="#38bdf8">NEXT.JS 16 · TYPESCRIPT</text><rect x="1060" y="180" width="480" height="520" rx="18" fill="#34d399" fill-opacity="0.04" stroke="#34d399" stroke-opacity="0.45" stroke-dasharray="6 6"/><text x="1078" y="208" font-family="JetBrains Mono" font-size="13" letter-spacing="1.5" fill="#34d399">SUPABASE</text><rect x="60" y="230" width="240" height="90" rx="12" fill="#111827" stroke="#2a3446"/><rect x="60" y="244" width="4" height="62" rx="2" fill="#818cf8"/><text x="80" y="260" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Customer</text><text x="80" y="284" font-family="Inter" font-size="14" fill="#94a3b8">writes on WhatsApp</text><rect x="60" y="380" width="240" height="110" rx="12" fill="#111827" stroke="#2a3446"/><rect x="60" y="394" width="4" height="82" rx="2" fill="#818cf8"/><text x="80" y="410" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">WhatsApp Cloud API</text><text x="80" y="434" font-family="Inter" font-size="14" fill="#94a3b8">official Meta Graph API</text><text x="80" y="455" font-family="Inter" font-size="14" fill="#94a3b8">no unofficial libraries</text><rect x="60" y="560" width="240" height="110" rx="12" fill="#111827" stroke="#2a3446"/><rect x="60" y="574" width="4" height="82" rx="2" fill="#fb7185"/><text x="80" y="590" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Staff</text><text x="80" y="614" font-family="Inter" font-size="14" fill="#94a3b8">replies from the business</text><text x="80" y="635" font-family="Inter" font-size="14" fill="#94a3b8">number → bot pauses</text><rect x="610" y="215" width="390" height="150" rx="12" fill="#111827" stroke="#2a3446"/><rect x="610" y="229" width="4" height="122" rx="2" fill="#38bdf8"/><text x="630" y="245" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Webhook route</text><text x="630" y="269" font-family="JetBrains Mono" font-size="13" fill="#94a3b8">X-Hub-Signature-256 check</text><text x="630" y="290" font-family="Inter" font-size="14" fill="#94a3b8">Fast 200, work after response</text><text x="630" y="311" font-family="Inter" font-size="14" fill="#94a3b8">Idempotent on message ID</text><text x="630" y="332" font-family="Inter" font-size="14" fill="#94a3b8">Per-conversation debounce</text><rect x="610" y="385" width="390" height="150" rx="12" fill="#111827" stroke="#2a3446"/><rect x="610" y="399" width="4" height="122" rx="2" fill="#38bdf8"/><text x="630" y="415" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Agent loop (hand-written)</text><text x="630" y="439" font-family="Inter" font-size="14" fill="#94a3b8">System prompt + rolling summary</text><text x="630" y="460" font-family="Inter" font-size="14" fill="#94a3b8">Last 20 messages · iteration cap</text><text x="630" y="481" font-family="Inter" font-size="14" fill="#94a3b8">Provider interface (swappable LLM)</text><text x="630" y="502" font-family="Inter" font-size="14" fill="#94a3b8">Every returned ID re-checked</text><rect x="610" y="555" width="230" height="120" rx="12" fill="#111827" stroke="#2a3446"/><rect x="610" y="569" width="4" height="92" rx="2" fill="#38bdf8"/><text x="630" y="585" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">24-hour reminders</text><text x="630" y="609" font-family="Inter" font-size="14" fill="#94a3b8">scheduled job</text><rect x="1080" y="215" width="440" height="170" rx="12" fill="#111827" stroke="#2a3446"/><rect x="1080" y="229" width="4" height="142" rx="2" fill="#34d399"/><text x="1100" y="245" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Postgres + Row-Level Security</text><text x="1100" y="269" font-family="JetBrains Mono" font-size="13" fill="#94a3b8">tenant_id on every table</text><text x="1100" y="290" font-family="Inter" font-size="14" fill="#94a3b8">Tenant resolved from WhatsApp number</text><text x="1100" y="311" font-family="Inter" font-size="14" fill="#94a3b8">Times stored in UTC, shown in local time</text><rect x="1080" y="405" width="440" height="170" rx="12" fill="#111827" stroke="#2a3446"/><rect x="1080" y="419" width="4" height="142" rx="2" fill="#34d399"/><text x="1100" y="435" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">No double bookings</text><text x="1100" y="459" font-family="Inter" font-size="14" fill="#94a3b8">Slots = opening hours − blocks − bookings</text><text x="1100" y="480" font-family="JetBrains Mono" font-size="13" fill="#94a3b8">EXCLUDE USING gist (tstzrange)</text><text x="1100" y="501" font-family="Inter" font-size="14" fill="#94a3b8">(btree_gist) rejects overlaps</text><rect x="1080" y="595" width="440" height="90" rx="12" fill="#111827" stroke="#2a3446"/><rect x="1080" y="609" width="4" height="62" rx="2" fill="#34d399"/><text x="1100" y="625" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Conversations + contacts</text><text x="1100" y="649" font-family="Inter" font-size="14" fill="#94a3b8">human-takeover flag, summary</text><rect x="610" y="740" width="390" height="130" rx="12" fill="#111827" stroke="#2a3446"/><rect x="610" y="754" width="4" height="102" rx="2" fill="#c084fc"/><text x="630" y="770" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Claude Haiku 4.5</text><text x="630" y="794" font-family="Inter" font-size="14" fill="#94a3b8">tool use + prompt caching</text><text x="630" y="815" font-family="Inter" font-size="14" fill="#94a3b8">behind the provider interface</text><rect x="1080" y="740" width="440" height="150" rx="12" fill="#111827" stroke="#2a3446"/><rect x="1080" y="754" width="4" height="122" rx="2" fill="#fbbf24"/><text x="1100" y="770" font-family="Inter" font-weight="600" font-size="17" fill="#e5e7eb">Six agent tools</text><text x="1100" y="794" font-family="Inter" font-size="14" fill="#94a3b8">check availability · book</text><text x="1100" y="815" font-family="Inter" font-size="14" fill="#94a3b8">reschedule · cancel</text><text x="1100" y="836" font-family="Inter" font-size="14" fill="#94a3b8">my appointments · hand off to human</text><path d="M180,320 L180,380" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mmuted)" marker-start="url(#smuted)"/><path d="M300,410 L610,290" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#msky)"/><rect x="395.6" y="328" width="118.8" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="455" y="344.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">signed webhook</text><path d="M805,365 L805,385" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#msky)"/><path d="M610,470 L300,450" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#msky)"/><rect x="428.0" y="450" width="54.0" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="455" y="466.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">reply</text><path d="M610,615 L300,470" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mmuted)"/><rect x="413.6" y="533" width="82.8" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="455" y="549.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">reminders</text><path d="M180,560 L180,490" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#mrose)"/><rect x="124.19999999999999" y="513" width="111.60000000000001" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="180" y="529.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">staff message</text><path d="M920,535 L920,740" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#mviolet)" marker-start="url(#sviolet)"/><rect x="835.4" y="700" width="169.20000000000002" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="920" y="716.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">messages ⇄ tool calls</text><path d="M1000,470 L1040,470 L1040,815 L1080,815" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#mamber)"/><path d="M1300,740 L1300,685" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#mamber)"/><path d="M1000,300 L1080,300" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mmuted)"/><rect x="1009.4" y="270" width="61.2" height="24" rx="12" fill="#0b0f17" stroke="#2a3446"/><text x="1040" y="286.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#e5e7eb">tenant</text><text x="60" y="940" text-anchor="start" font-family="Inter" font-size="15" fill="#94a3b8">20 scripted conversations (prompt injection, other people’s bookings, double booking, discounts) + unit tests with the LLM mocked.</text><text x="1540" y="970" text-anchor="end" font-family="JetBrains Mono" font-size="12" fill="#475569">Architecture derived from the project source · names anonymized</text></svg>